<style>
/* Layout: a production contact sheet. Featured frame + notes on top, five thumbnails below, full storyboard table last. */
:root{
  --bg:#ece3d3; --surface:#f8f1e4; --ink:#243139; --muted:#5f6b70; --line:rgba(36,49,57,.16);
  --accent:#C56B50; --accent-ink:#fff8eb; --chip:#e4d8c3;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a2125; --surface:#222c31; --ink:#f0e7d8; --muted:#a7b0b2; --line:rgba(240,231,216,.14);
  --accent:#e0896d; --accent-ink:#1a2125; --chip:#2e3a40; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1a2125; --surface:#222c31; --ink:#f0e7d8; --muted:#a7b0b2; --line:rgba(240,231,216,.14);
  --accent:#e0896d; --accent-ink:#1a2125; --chip:#2e3a40; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.spec{display:flex;flex-wrap:wrap;gap:6px}
.spec span{background:var(--chip);border-radius:3px;padding:3px 9px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:980px){.viewer{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:#F3EBDD;border-radius:4px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 12px 30px rgba(40,25,15,.18);aspect-ratio:16/9;max-width:100%}
.stage canvas{display:block;width:100%;height:100%;cursor:zoom-in}
.stage button{position:absolute;right:10px;bottom:10px;font:600 12px/1 var(--f-body);background:rgba(36,49,57,.82);color:#fff8eb;border:0;border-radius:3px;padding:8px 10px;cursor:pointer}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 18px 8px;min-width:0}
.notes h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0 0 2px}
.notes .time{font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.notes dl{margin:14px 0 0;display:grid;gap:10px}
.notes dt{font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.notes dd{margin:2px 0 0;font-size:14px;color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:700 13px/1 var(--f-body);letter-spacing:.04em;padding:9px 12px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.thumb{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:grid;gap:8px}
.thumb[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.thumb canvas{display:block;width:100%;aspect-ratio:16/9;height:auto;border-radius:2px;background:#F3EBDD}
.thumb b{font-family:var(--f-display);font-weight:600;font-size:17px}
.thumb small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;min-width:1180px;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}

td:first-child{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap}

dialog{border:0;padding:0;background:transparent;max-width:min(96vw,1920px);width:96vw}

dialog .bar{display:flex;justify-content:space-between;align-items:center;color:#f3ebdd;padding:8px 2px;font-weight:600}

@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}

<script>
(() => {
'use strict';
/* =========================================================
   ENGINE — deterministic, time-based paper renderer
   Design space is 1920×1080; every draw call works in it.
   ========================================================= */
const DW = 1920, DH = 1080;

/* ---------- color ---------- */
function hx(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function toHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const A=hx(a),B=hx(b); return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t); }
function shade(a,t){ return t<0 ? mix(a,'#1d1712',-t) : mix(a,'#fffaf0',t); }
function rgba(a,al){ const A=hx(a); return `rgba(${A[0]},${A[1]},${A[2]},${al})`; }
const C = { cream:'#F3EBDD', card:'#FFF8EB', char:'#243139', terra:'#C56B50', mustard:'#E8B65C', sage:'#8A9B7C', blue:'#7C9DA5' };
Object.assign(C,{
  kraft:'#DCA46A', kraftD:'#A9763F', tan:shade(C.cream,-.11), charL:shade(C.char,.14),
  glow:mix(C.terra,C.mustard,.5), hot:'#F8D98F', deep:'#8E4B3A', steel:mix(C.blue,C.char,.32),
  sageD:shade(C.sage,-.28), blueD:shade(C.blue,-.3), terraD:shade(C.terra,-.22)
});

/* ---------- math / easing ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>t*t*(3-2*t);
const Ez={ lin:t=>t, out3:t=>1-(1-t)**3, in3:t=>t*t*t, io3:t=>t<.5?4*t*t*t:1-((-2*t+2)**3)/2,
  out5:t=>1-(1-t)**5, outBack:t=>{const c=1.5;return 1+(c+1)*(t-1)**3+c*(t-1)**2;}, ioS:t=>-(Math.cos(Math.PI*t)-1)/2 };
const R=(t,a,d,e=Ez.out3)=>e(clamp((t-a)/d));
const stepT=(t,fps=12)=>Math.floor(t*fps)/fps;           // stop-motion accent
function bez(p0,p1,p2,p3,t){const u=1-t;return[u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]];}
function bezD(p0,p1,p2,p3,t){const u=1-t;return[3*u*u*(p1[0]-p0[0])+6*u*t*(p2[0]-p1[0])+3*t*t*(p3[0]-p2[0]),3*u*u*(p1[1]-p0[1])+6*u*t*(p2[1]-p1[1])+3*t*t*(p3[1]-p2[1])];}

/* ---------- well-mixed deterministic randomness ---------- */
function h32(x){ x|=0; x=Math.imul(x^(x>>>16),0x7feb352d); x=Math.imul(x^(x>>>15),0x846ca68b); return (x^(x>>>16))>>>0; }
function rnd(seed){ let s=h32((seed>>>0)^0x632BE5AB)|0; return ()=>{ s=(s+0x9E3779B9)|0; let z=s; z=Math.imul(z^(z>>>16),0x85ebca6b); z=Math.imul(z^(z>>>13),0xc2b2ae35); z^=z>>>16; return (z>>>0)/4294967296; }; }
function hf(a,b=0,c=0){ return h32(Math.imul(a|0,374761393)^h32(Math.imul(b|0,668265263)^h32(Math.imul(c|0,1274126177)+0x27d4eb2d)))/4294967296; }
function noise1(x,seed){ const i=Math.floor(x),f=x-i,u=f*f*(3-2*f); return lerp(hf(i,seed),hf(i+1,seed),u)*2-1; }
function seedOf(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

/* ---------- paper fiber textures (built once, tileable) ---------- */
const TEX={};
function tileNoise(x,y,S,cell,seed){ const P=S/cell, gx=x/cell, gy=y/cell, ix=Math.floor(gx), iy=Math.floor(gy), fx=gx-ix, fy=gy-iy, ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const v=(i,j)=>hf(((i%P)+P)%P,((j%P)+P)%P,seed); return lerp(lerp(v(ix,iy),v(ix+1,iy),ux),lerp(v(ix,iy+1),v(ix+1,iy+1),ux),uy); }
function makeGrain(){
  const S=256;
  const layer=(dark)=>{
    const c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
    const img=g.createImageData(S,S), d=img.data, col=dark?[62,40,24]:[255,252,244];
    for(let y=0;y<S;y++) for(let x=0;x<S;x++){
      const wn=hf(x,y,dark?11:23), v=tileNoise(x,y,S,16,dark?3:5)*.6+tileNoise(x,y,S,64,dark?9:13)*.4;
      const a=dark ? Math.max(0,wn-.58)*.62+Math.max(0,v-.56)*.42 : Math.max(0,wn-.62)*.55+Math.max(0,.44-v)*.34;
      const i=(y*S+x)*4; d[i]=col[0]; d[i+1]=col[1]; d[i+2]=col[2]; d[i+3]=Math.round(a*255);
    }
    g.putImageData(img,0,0);
    const r=rnd(dark?101:202); g.lineCap='round';
    for(let k=0;k<(dark?150:130);k++){
      const x0=r()*S,y0=r()*S,ang=r()*Math.PI*2,len=6+r()*24,bend=(r()-.5)*9;
      g.strokeStyle=dark?`rgba(70,45,28,${.05+r()*.09})`:`rgba(255,253,246,${.09+r()*.14})`; g.lineWidth=.5+r()*.8;
      for(const ox of [-S,0,S]) for(const oy of [-S,0,S]){ const x1=x0+ox,y1=y0+oy; g.beginPath(); g.moveTo(x1,y1);
        g.quadraticCurveTo(x1+Math.cos(ang)*len/2-Math.sin(ang)*bend,y1+Math.sin(ang)*len/2+Math.cos(ang)*bend,x1+Math.cos(ang)*len,y1+Math.sin(ang)*len); g.stroke(); }
    }
    return c;
  };
  TEX.dark=layer(true); TEX.light=layer(false);
}
const PATS=new WeakMap();
function pats(ctx){ const m=ctx.getTransform(), eff=Math.hypot(m.a,m.b), k=Math.max(1.25,.9/eff), key=k.toFixed(2);
  let e=PATS.get(ctx); if(!e){e={};PATS.set(ctx,e);}
  if(!e[key]){ const d=ctx.createPattern(TEX.dark,'repeat'), l=ctx.createPattern(TEX.light,'repeat'), M=new DOMMatrix([k,0,0,k,0,0]); d.setTransform(M); l.setTransform(M); e[key]={dark:d,light:l}; }
  return e[key]; }

/* ---------- shape generation: hand-cut edges ---------- */
function densify(pts,step=6){ const out=[],n=pts.length; for(let i=0;i<n;i++){ const a=pts[i],b=pts[(i+1)%n],d=Math.hypot(b[0]-a[0],b[1]-a[1]),k=Math.max(1,Math.ceil(d/step)); for(let j=0;j<k;j++){const t=j/k; out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);} } return out; }
function rough(pts,seed,amp=1.4){ const d=densify(pts),n=d.length,out=new Array(n),r=rnd(seed); let s=0;
  for(let i=0;i<n;i++){ const a=d[(i-1+n)%n],b=d[(i+1)%n]; let nx=-(b[1]-a[1]),ny=b[0]-a[0]; const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
    if(i>0) s+=Math.hypot(d[i][0]-d[i-1][0],d[i][1]-d[i-1][1]);
    const o=amp*(.72*noise1(s/36,seed&0xffff)+.28*noise1(s/9,(seed+7)&0xffff))+(r()-.5)*amp*.22; out[i]=[d[i][0]+nx*o,d[i][1]+ny*o]; }
  return out; }
function rrect(x,y,w,h,r=0){ r=Math.min(r,w/2,h/2); if(r<=0) return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]; const p=[];
  const arc=(cx,cy,a0)=>{for(let i=0;i<=6;i++){const a=a0+i/6*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}};
  arc(x+w-r,y+r,-Math.PI/2); arc(x+w-r,y+h-r,0); arc(x+r,y+h-r,Math.PI/2); arc(x+r,y+r,Math.PI); return p; }
function ell(cx,cy,rx,ry,n=48){ const p=[]; for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);} return p; }
function arcPts(cx,cy,rx,ry,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);} return p; }
function spline(ctrl,seg=10){ const n=ctrl.length,out=[],g=i=>ctrl[(i+n)%n];
  for(let i=0;i<n;i++){ const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    for(let j=0;j<seg;j++){ const t=j/seg,t2=t*t,t3=t2*t, f=k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3); out.push([f(0),f(1)]); } }
  return out; }
function pathOf(pts,closed=true){ const p=new Path2D(); p.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) p.lineTo(pts[i][0],pts[i][1]); if(closed) p.closePath(); return p; }
function bboxOf(pts){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const [x,y] of pts){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; } return {x:x0,y:y0,w:x1-x0,h:y1-y0}; }

/* ---------- Piece: a cached sheet of cut paper ---------- */
const LIGHT={dx:5,dy:8};
function quant(e){ return Math.min(2.5,Math.pow(2,Math.ceil(Math.log2(Math.max(.05,e))*4)/4)); }
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h)); return c; }
class Piece{
  constructor(o){ this.o=o; const cs=o.contours||[o.pts]; this.path=new Path2D(); for(const c of cs) this.path.addPath(pathOf(c));
    this.rule=o.rule||(cs.length>1?'evenodd':'nonzero'); this.bb=bboxOf(cs.flat()); this.color=o.color; this.edge=o.edge||shade(o.color,-.3);
    this.seed=o.seed||seedOf(String(o.color)+this.bb.x+this.bb.w); this.cache=new Map(); this.sh=new Map(); }
  sprite(q){ let s=this.cache.get(q); if(s) return s; const pad=6,bb=this.bb,o=this.o,P=this.path,Rl=this.rule;
    const c=mkCanvas((bb.w+pad*2)*q,(bb.h+pad*2)*q),g=c.getContext('2d'); g.scale(q,q); g.translate(pad-bb.x,pad-bb.y);
    if(!o.flat){ g.save(); g.shadowColor='rgba(55,32,18,.34)'; g.shadowBlur=3.2*q; g.shadowOffsetX=1.1*q; g.shadowOffsetY=1.9*q; g.translate(.9,1.5); g.fillStyle=this.edge; g.fill(P,Rl); g.restore(); }
    g.fillStyle=o.fill?o.fill(g,bb):this.color; g.fill(P,Rl);
    g.save(); g.clip(P,Rl);
    if(o.decor){ g.save(); o.decor(g,bb); g.restore(); }
    const lg=g.createLinearGradient(bb.x,bb.y,bb.x+bb.w*.55,bb.y+bb.h); lg.addColorStop(0,'rgba(255,250,238,.11)'); lg.addColorStop(1,'rgba(40,25,15,.08)'); g.fillStyle=lg; g.fillRect(bb.x,bb.y,bb.w,bb.h);
    const tex=o.tex??1; if(tex>0){ const off=rnd(this.seed), k=Math.max(1.25,.9/q), M=new DOMMatrix([k,0,0,k,off()*256,off()*256]);
      const pd=g.createPattern(TEX.dark,'repeat'); pd.setTransform(M); g.globalAlpha=.6*tex; g.fillStyle=pd; g.fillRect(bb.x,bb.y,bb.w,bb.h);
      const pl=g.createPattern(TEX.light,'repeat'); pl.setTransform(M); g.globalAlpha=.7*tex; g.fillStyle=pl; g.fillRect(bb.x,bb.y,bb.w,bb.h); g.globalAlpha=1; }
    if(!o.flat){ g.translate(1.1,1.1); g.strokeStyle='rgba(255,251,242,.42)'; g.lineWidth=1.6; g.stroke(P); }
    g.restore();
    s={c,x:bb.x-pad,y:bb.y-pad,w:c.width/q,h:c.height/q}; this.cache.set(q,s); return s; }
  shadow(q){ q=Math.max(.1,q*.5); let s=this.sh.get(q); if(s) return s; const blur=this.o.blur??10,pad=blur*2+4,bb=this.bb;
    const c=mkCanvas((bb.w+pad*2)*q,(bb.h+pad*2)*q),g=c.getContext('2d'); g.scale(q,q); g.translate(pad-bb.x,pad-bb.y);
    g.shadowColor='rgba(72,42,22,.34)'; g.shadowBlur=blur*q; g.shadowOffsetX=6000*q; g.translate(-6000,0); g.fillStyle='#000'; g.fill(this.path,this.rule);
    s={c,x:bb.x-pad,y:bb.y-pad,w:c.width/q,h:c.height/q}; this.sh.set(q,s); return s; }
  draw(ctx,x=0,y=0,o={}){ const a=o.alpha??1; if(a<=.002) return; const rot=o.rot||0,sc=o.s??1,sx=sc*(o.sx??1),sy=sc*(o.sy??1),elev=o.elev??1;
    const m=ctx.getTransform(),eff=Math.hypot(m.a,m.b)*Math.max(Math.abs(sx),Math.abs(sy)),q=quant(eff);
    ctx.save(); if(a<1) ctx.globalAlpha*=a;
    if(elev>0&&this.o.shadow!==false){ const sh=this.shadow(q); ctx.save(); ctx.translate(x+LIGHT.dx*elev,y+LIGHT.dy*elev); if(rot) ctx.rotate(rot); ctx.scale(sx,sy); ctx.globalAlpha*=Math.min(1,.42+.28*elev); ctx.drawImage(sh.c,sh.x,sh.y,sh.w,sh.h); ctx.restore(); }
    const sp=this.sprite(q); ctx.translate(x,y); if(rot) ctx.rotate(rot); ctx.scale(sx,sy); ctx.drawImage(sp.c,sp.x,sp.y,sp.w,sp.h); ctx.restore(); }
}
const REG=new Map();
function pc(key,fn){ let p=REG.get(key); if(!p){ p=new Piece(fn()); REG.set(key,p); } return p; }

/* immediate-mode paper for shapes that change every frame */
function paperNow(ctx,path,color,o={}){ const m=ctx.getTransform(),eff=Math.hypot(m.a,m.b),Rl=o.rule||'nonzero',el=o.elev??1;
  ctx.save(); if(o.alpha!=null) ctx.globalAlpha*=o.alpha;
  if(el>0){ ctx.save(); ctx.shadowColor=`rgba(70,40,22,${.26*(o.sh??1)})`; ctx.shadowBlur=(o.blur??9)*eff; ctx.shadowOffsetX=LIGHT.dx*el*eff; ctx.shadowOffsetY=LIGHT.dy*el*eff; ctx.translate(.9,1.5); ctx.fillStyle=o.edge||shade(typeof color==='string'?color:C.char,-.3); ctx.fill(path,Rl); ctx.restore(); }
  ctx.fillStyle=color; ctx.fill(path,Rl);
  if((o.tex??1)>0){ const pt=pats(ctx); ctx.save(); ctx.globalAlpha*=.55*(o.tex??1); ctx.fillStyle=pt.dark; ctx.fill(path,Rl); ctx.globalAlpha=Math.min(1,ctx.globalAlpha*1.2); ctx.fillStyle=pt.light; ctx.fill(path,Rl); ctx.restore(); }
  ctx.restore(); }

/* ---------- typography ---------- */
const FONT={ serif:(w,s)=>`${w} ${s}px Fraunces, Georgia, "Times New Roman", serif`, sans:(w,s)=>`${w} ${s}px Archivo, "Helvetica Neue", Arial, sans-serif` };
const MC=document.createElement('canvas').getContext('2d');
function parseChem(s){ const out=[]; let b=''; for(let i=0;i<s.length;i++){ if(s[i]==='_'&&i+1<s.length){ if(b){out.push({t:b,sub:0});b='';} out.push({t:s[i+1],sub:1}); i++; } else b+=s[i]; } if(b) out.push({t:b,sub:0}); return out; }
const fsize=f=>{const m=f.match(/(\d+(?:\.\d+)?)px/);return m?parseFloat(m[1]):20;};
const subF=f=>f.replace(/(\d+(?:\.\d+)?)px/,(fsize(f)*.64).toFixed(1)+'px');
function measure(str,font,tr=0){ let w=0; for(const sg of parseChem(str)){ MC.font=sg.sub?subF(font):font; if(tr){ for(const ch of sg.t) w+=MC.measureText(ch).width+tr; } else w+=MC.measureText(sg.t).width; } return tr?w-tr:w; }
function txt(g,str,x,y,o={}){ const font=o.font||FONT.sans(500,22),tr=o.track||0; g.save(); if(o.alpha!=null) g.globalAlpha*=o.alpha; g.fillStyle=o.color||C.char; g.textBaseline='alphabetic';
  if(!tr&&str.indexOf('_')<0){ g.font=font; g.textAlign=o.align||'left'; g.fillText(str,x,y); g.restore(); return; }
  const w=measure(str,font,tr),sz=fsize(font); let cx=o.align==='center'?x-w/2:o.align==='right'?x-w:x; g.textAlign='left';
  for(const sg of parseChem(str)){ g.font=sg.sub?subF(font):font; const dy=sg.sub?sz*.2:0; if(tr){ for(const ch of sg.t){ g.fillText(ch,cx,y+dy); cx+=g.measureText(ch).width+tr; } } else { g.fillText(sg.t,cx,y+dy); cx+=g.measureText(sg.t).width; } }
  g.restore(); }
/* headline: kicker + words rising out of a paper slot */
function headline(ctx,kicker,title,t,o={}){ const x=o.x??140,y=o.y??242,sz=o.size??90,font=FONT.serif(600,sz);
  const ka=R(t,0,.45); if(ka>0){ pc('kbar',()=>({pts:rough(rrect(0,0,34,6,1),31,.5),color:C.terra,blur:3})).draw(ctx,x,y-sz-22,{elev:.3,alpha:ka,sx:ka});
    txt(ctx,kicker,x+46,y-sz-12,{font:FONT.sans(800,19),track:3.2,color:C.terra,alpha:ka}); }
  MC.font=font; const sp=MC.measureText(' ').width; let cx=x;
  title.split(' ').forEach((w,i)=>{ const ww=MC.measureText(w).width, p=R(t,.12+i*.07,.6,Ez.out5);
    if(p>0){ ctx.save(); ctx.beginPath(); ctx.rect(cx-12,y-sz*1.08,ww+24,sz*1.42); ctx.clip(); txt(ctx,w,cx,y+(1-p)*sz*1.05,{font,color:C.char}); ctx.restore(); }
    cx+=ww+sp; }); }
/* paper tag with crisp text on top */
function tag(ctx,str,x,y,o={}){ const sz=o.size??17,font=o.font??FONT.sans(800,sz),tr=o.track??1.8,w=measure(str,font,tr)+(o.padX??14)*2,h=o.h??Math.round(sz*1.95),bg=o.bg??C.card;
  const p=pc('tag:'+str+':'+bg+':'+sz,()=>({pts:rough(rrect(-w/2,-h/2,w,h,o.r??3),seedOf(str+bg),.8),color:bg,blur:6}));
  const cx=o.center?x:x+w/2, a=o.alpha??1; if(a<=0) return w;
  p.draw(ctx,cx,y,{rot:o.rot||0,elev:o.elev??.55,alpha:a,s:o.s??1});
  ctx.save(); ctx.translate(cx,y); if(o.rot) ctx.rotate(o.rot); if(o.s!=null) ctx.scale(o.s,o.s); txt(ctx,str,0,sz*.36,{font,track:tr,color:o.fg??C.char,align:'center',alpha:a}); ctx.restore(); return w; }
function badge(ctx,n,x,y,o={}){ const r=o.r??17,col=o.col||C.terra,a=o.alpha??1; if(a<=0) return;
  pc('badge:'+r+col,()=>({pts:rough(ell(0,0,r,r,40),seedOf('bd'+r+col),.7),color:col,blur:5})).draw(ctx,x,y,{elev:o.elev??.6,alpha:a,s:o.s??1});
  txt(ctx,String(n),x,y+r*.4,{font:FONT.serif(700,Math.round(r*1.12)),color:o.fg||C.card,align:'center',alpha:a}); }
function leader(ctx,pts,p=1,o={}){ if(p<=0) return; let L=0; const sg=[]; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);sg.push(d);L+=d;}
  let rem=L*p; ctx.save(); ctx.strokeStyle=o.col||C.char; ctx.lineWidth=o.lw||1.8; if(o.dash) ctx.setLineDash(o.dash); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ const d=sg[i-1]; if(rem>=d){ctx.lineTo(pts[i][0],pts[i][1]);rem-=d;} else {const f=rem/d; ctx.lineTo(lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f)); break;} }
  ctx.stroke(); ctx.setLineDash([]); if(o.dot!==false){ ctx.fillStyle=o.col||C.char; ctx.beginPath(); ctx.arc(pts[0][0],pts[0][1],o.r||5,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=C.card; ctx.lineWidth=2; ctx.stroke(); } ctx.restore(); }
function dashArrow(ctx,x0,y0,x1,y1,o={}){ const col=o.col||rgba(C.char,.62); ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=o.lw||2.4; ctx.setLineDash(o.dash||[9,7]); ctx.lineDashOffset=o.off||0;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); ctx.setLineDash([]); const a=Math.atan2(y1-y0,x1-x0),L=13;
  ctx.beginPath(); ctx.moveTo(x1+Math.cos(a)*3,y1+Math.sin(a)*3); ctx.lineTo(x1-Math.cos(a-.45)*L,y1-Math.sin(a-.45)*L); ctx.lineTo(x1-Math.cos(a+.45)*L,y1-Math.sin(a+.45)*L); ctx.closePath(); ctx.fill(); ctx.restore(); }

/* glass, drawn as tinted vellum */
const GP=new Map();
function bottlePts(W,H,o={}){ const hw=W/2,nw=W*(o.neck??.3)/2,lw=nw+W*.045,r=W*.16,yB=-H*(o.body??.58),yN=-H*(o.sh??.8),yL=-H*.94,yT=-H,rt=[[lw,yT],[lw,yL],[nw,yL],[nw,yN]];
  for(let i=1;i<=12;i++) rt.push(bez([nw,yN],[nw+(hw-nw)*.08,yN+(yB-yN)*.5],[hw,yN+(yB-yN)*.38],[hw,yB],i/12));
  rt.push([hw,-r]); for(let i=1;i<=6;i++){ const a=i/6*Math.PI/2; rt.push([hw-r+Math.cos(a)*r,-r+Math.sin(a)*r]); }
  return rt.concat(rt.slice().reverse().map(([x,y])=>[-x,y])); }
function jarPts(W,H){ const hw=W/2,nw=W*.36,r=W*.2,yS=-H*.8,yN=-H*.86,rt=[[nw,-H],[nw,yN]];
  for(let i=1;i<=8;i++) rt.push(bez([nw,yN],[nw+(hw-nw)*.6,yN],[hw,yN+(yS-yN)*.2],[hw,yS],i/8));
  rt.push([hw,-r]); for(let i=1;i<=6;i++){ const a=i/6*Math.PI/2; rt.push([hw-r+Math.cos(a)*r,-r+Math.sin(a)*r]); }
  return rt.concat(rt.slice().reverse().map(([x,y])=>[-x,y])); }
function glassShape(kind,W,H,o={}){ const k=kind+W+'x'+H+(o.neck||''); let g=GP.get(k); if(!g){ const pts=rough(kind==='jar'?jarPts(W,H):bottlePts(W,H,o),seedOf(k),.7); g={path:pathOf(pts),bb:bboxOf(pts)}; GP.set(k,g); } return g; }
function glassFront(ctx,path,bb,o={}){ ctx.save(); ctx.clip(path); const pt=pats(ctx); ctx.globalAlpha=.5; ctx.fillStyle=pt.light; ctx.fillRect(bb.x,bb.y,bb.w,bb.h); ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,252,244,.55)'; ctx.fillRect(bb.x+bb.w*.15,bb.y,bb.w*.075,bb.h); ctx.fillStyle='rgba(255,252,244,.28)'; ctx.fillRect(bb.x+bb.w*.27,bb.y,bb.w*.035,bb.h);
  ctx.fillStyle='rgba(36,49,57,.10)'; ctx.fillRect(bb.x+bb.w*.78,bb.y,bb.w*.12,bb.h); ctx.restore();
  ctx.save(); ctx.strokeStyle=o.line||'rgba(36,49,57,.62)'; ctx.lineWidth=o.lw||2.4; ctx.stroke(path); ctx.restore(); }
function drawGlass(ctx,kind,cx,by,W,H,o={}){ const {path,bb}=glassShape(kind,W,H,o); ctx.save(); ctx.translate(cx,by); if(o.rot) ctx.rotate(o.rot); if(o.s) ctx.scale(o.s,o.s); if(o.alpha!=null) ctx.globalAlpha*=o.alpha;
  const m=ctx.getTransform(),eff=Math.hypot(m.a,m.b);
  ctx.save(); ctx.shadowColor='rgba(70,40,22,.55)'; ctx.shadowBlur=12*eff; ctx.shadowOffsetX=5*eff; ctx.shadowOffsetY=8*eff; ctx.fillStyle=o.fill||'rgba(124,157,165,.30)'; ctx.fill(path); ctx.restore();
  if(o.inner){ ctx.save(); ctx.clip(path); o.inner(ctx,bb); ctx.restore(); }
  glassFront(ctx,path,bb,o);
  if(kind==='jar'&&o.lid!==false){ pc('lid'+W,()=>({pts:rough(rrect(-W*.4,-H*1.07,W*.8,H*.11,3),seedOf('lid'+W),.6),color:o.lidCol||C.terra,blur:4})).draw(ctx,0,0,{elev:.4}); }
  ctx.restore(); }

  pc('sackBd:'+id,()=>({pts:rough(spline([[-w*.4,0],[-w*.47,-h*.28],[-w*.46,-h*.62],[-w*.42,-h*.88],[0,-h*.86],[w*.42,-h*.88],[w*.46,-h*.62],[w*.47,-h*.28],[w*.4,0],[0,h*.025]],8),sd+3,1.3),color:C.kraft,blur:12,

      g.strokeStyle='rgba(255,236,205,.22)'; g.lineWidth=3; g.beginPath(); g.moveTo(-w*.36,-h*.78); g.quadraticCurveTo(-w*.42,-h*.4,-w*.34,-h*.08); g.stroke();
      g.setLineDash([6,5]); g.strokeStyle='rgba(70,42,18,.42)'; g.lineWidth=1.6; g.beginPath(); g.moveTo(-w*.42,-h*.075); g.lineTo(w*.42,-h*.075); g.stroke(); }})).draw(ctx,0,0,{elev:1});
  pc('sackRm:'+id,()=>({pts:rough([[-w*.46,-h*.94],[w*.46,-h*.94],[w*.45,-h*.79],[w*.26,-h*.815],[w*.06,-h*.785],[-w*.17,-h*.82],[-w*.45,-h*.79]],sd+4,1.1),color:shade(C.kraft,-.1),blur:5})).draw(ctx,0,0,{elev:.45});

/* ribbon = tapered paper strip along a cubic */
function ribbonPts(p0,p3,w0,w1,te=1,n=46){ const dx=(p3[0]-p0[0])*.5,c1=[p0[0]+dx,p0[1]],c2=[p3[0]-dx,p3[1]],top=[],bot=[];
  for(let i=0;i<=n;i++){ const t=te*i/n,p=bez(p0,c1,c2,p3,t),d=bezD(p0,c1,c2,p3,t),L=Math.hypot(d[0],d[1])||1,nx=-d[1]/L,ny=d[0]/L,w=lerp(w0,w1,sstep(t))/2;
    top.push([p[0]-nx*w,p[1]-ny*w]); bot.push([p[0]+nx*w,p[1]+ny*w]); }
  return {pts:top.concat(bot.reverse()),c1,c2}; }

/* honeycomb network: ordered crystal vs. jumbled glass */
const NETS={};
function network(key,b,amp){ if(NETS[key]) return NETS[key]; const vm=new Map(),es=new Set(),V=[],E=[],dx=Math.sqrt(3)*b,dy=1.5*b,kk=(x,y)=>Math.round(x*4)+','+Math.round(y*4);
  for(let j=-5;j<=5;j++) for(let i=-5;i<=5;i++){ const cx=i*dx+(j&1)*dx/2,cy=j*dy; if(Math.hypot(cx,cy)>b*5.2) continue; const ids=[];
    for(let k=0;k<6;k++){ const a=Math.PI/6+k*Math.PI/3,x=cx+b*Math.cos(a),y=cy+b*Math.sin(a),q=kk(x,y); let id=vm.get(q); if(id==null){id=V.length;vm.set(q,id);V.push([x,y]);} ids.push(id); }
    for(let k=0;k<6;k++){ const a=ids[k],c=ids[(k+1)%6],e=a<c?a+'-'+c:c+'-'+a; if(!es.has(e)){es.add(e);E.push([a,c]);} } }
  const J=V.map(([x,y],i)=>[x+(hf(i,41)-.5)*2*amp*b,y+(hf(i,42)-.5)*2*amp*b]);
  return NETS[key]={V,J,E}; }
function drawNetwork(ctx,net,cx,cy,mixv,rot=0){ ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot); const P=net.V.map((v,i)=>[lerp(v[0],net.J[i][0],mixv),lerp(v[1],net.J[i][1],mixv)]);
  ctx.strokeStyle=rgba(C.char,.55); ctx.lineWidth=2.6; ctx.beginPath(); for(const [a,b] of net.E){ ctx.moveTo(P[a][0],P[a][1]); ctx.lineTo(P[b][0],P[b][1]); } ctx.stroke();
  ctx.fillStyle=C.terra; for(const [a,b] of net.E){ ctx.beginPath(); ctx.arc((P[a][0]+P[b][0])/2,(P[a][1]+P[b][1])/2,3.4,0,7); ctx.fill(); }
  ctx.fillStyle=C.char; for(const p of P){ ctx.beginPath(); ctx.arc(p[0],p[1],5,0,7); ctx.fill(); } ctx.restore(); }

/* flame tongue pointing +x */
function flamePts(len,thick,seed){ const top=[],bot=[],N=26; for(let i=0;i<=N;i++){ const u=i/N,hw=thick*(.28*(1-u)+Math.pow(Math.sin(Math.PI*Math.min(1,u*1.12)),.9)*(1-u*.5)),lift=-u*u*len*.1,n1=noise1(u*5,seed)*.24,n2=noise1(u*5,seed+9)*.24;
  top.push([u*len,lift-hw*(1+n1)]); bot.push([u*len,lift+hw*(.85+n2)]); } return top.concat(bot.reverse()); }
function flame(ctx,id,x,y,len,dir,t){ const v=Math.floor(t*10)%4; ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);

  for(let rx=x0+18;rx<x1-8;rx+=56){ ctx.save(); ctx.translate(rx,y+11); ctx.rotate(t*3); ctx.fillStyle=shade(C.char,.28); ctx.beginPath(); ctx.arc(0,0,6.5,0,7); ctx.fill(); ctx.fillStyle=C.cream; ctx.fillRect(-1,-5,2,10); ctx.restore(); } }

    if(i===2){ const r=rnd(470); for(let k=0;k<11;k++){ const sx=(r()-.5)*84,sy=(r()-.5)*50+8; pc('cs'+k,()=>({pts:rough([[-9,0],[-2,-10],[10,-3],[6,8],[-5,7]],471+k,.4),color:k%3?mix(C.blue,C.card,.45):mix(C.sage,C.card,.35),blur:3})).draw(ctx,sx,sy,{rot:r()*6,elev:.4,s:.8+r()*.6}); } }
    if(i===3){ pc('mf',()=>({contours:[rough([[-40,34],[-40,-6],...arcPts(0,-6,40,30,Math.PI,2*Math.PI,16).slice(1,-1),[40,-6],[40,34]],480,.8),rough([[-22,30],[-22,0],...arcPts(0,0,22,16,Math.PI,2*Math.PI,12).slice(1,-1),[22,0],[22,30]],481,.6)],color:C.terra,blur:5})).draw(ctx,0,0,{elev:.6});
      ctx.fillStyle=C.mustard; ctx.beginPath(); ctx.moveTo(-20,30); ctx.lineTo(-20,2); ctx.quadraticCurveTo(0,-26,20,2); ctx.lineTo(20,30); ctx.closePath(); ctx.fill(); ctx.fillStyle=C.hot; ctx.beginPath(); ctx.ellipse(0,18,10,12,0,0,7); ctx.fill(); }
    ctx.restore();
    const lx=i===3?x-86:i===1?x+86:x+82, ly=i===0?y-34:i===2?y+30:y-6, al2=R(t,.8+i*.32,.5);
    txt(ctx,lab,lx,ly,{font:FONT.sans(800,17),track:2.4,align:i===3?'right':'left',alpha:al2,color:C.char}); txt(ctx,sub,lx,ly+26,{font:FONT.sans(400,19),align:i===3?'right':'left',alpha:al2,color:rgba(C.char,.78)}); });
  const cp=R(t,1.9,.7,Ez.out5); if(cp>0){ ctx.save(); ctx.globalAlpha*=cp; txt(ctx,'Recyclable',LC.x,LC.y-12+(1-cp)*20,{font:FONT.serif(600,50),align:'center'}); txt(ctx,'again and again',LC.x,LC.y+40+(1-cp)*20,{font:FONT.serif(500,36),align:'center',color:C.terraD}); txt(ctx,'with no loss in quality',LC.x,LC.y+84,{font:FONT.sans(500,21),align:'center',color:rgba(C.char,.75)}); ctx.restore(); }
  txt(ctx,'THE WHOLE JOURNEY',140,370,{font:FONT.sans(800,18),track:3,alpha:R(t,.9,.5)});
  [['Mix sand, soda ash & limestone',C.mustard],['Melt at ~1,500 °C',C.terra],['Float flat or blow into shape',C.blue],['Anneal: cool it slowly',C.sage],['Recycle, and repeat',C.char]].forEach(([s,col],i)=>{ const p=R(t,1.0+i*.22,.45,Ez.out5); if(p<=0) return;
    badge(ctx,i+1,158,428+i*88,{r:19,col,alpha:p}); txt(ctx,s,194,438+i*88+(1-p)*14,{font:FONT.serif(500,30),alpha:p}); if(i<4){ ctx.fillStyle=rgba(C.char,.12*p); ctx.fillRect(194,462+i*88,450,1.5); } });
}

let SEL=0;
function renderTo(canvas,si){ const ctx=canvas.getContext('2d'),k=canvas.width/DW; ctx.setTransform(k,0,0,k,0,0); ctx.clearRect(0,0,DW,DH);
  drawBackdrop(ctx); const S=SCENES[si]; S.draw(ctx,S.rep); drawChrome(ctx,si,(S.start+S.rep)/30); }
function sizeBig(){ const c=document.getElementById('big'),w=Math.min(1920,Math.round(c.clientWidth*(window.devicePixelRatio||1))); if(w>0&&c.width!==w){ c.width=w; c.height=Math.round(w*9/16); } }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function select(i){ SEL=i; sizeBig(); renderTo(document.getElementById('big'),i); const S=SCENES[i];
  document.getElementById('notes').innerHTML=`<div class="time">Scene ${i+1} · ${S.time}</div><h2>${S.title}</h2><dl><dt>What the viewer learns</dt><dd>${esc(S.info)}</dd><dt>Motion</dt><dd>${esc(S.beats)}</dd><dt>Into the next scene</dt><dd>${esc(S.trans)}</dd><dt>Sound</dt><dd>${esc(S.sound)}</dd></dl>`;
  document.querySelectorAll('#tabs button,.thumb').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===i))); }
function build(){ const tabs=document.getElementById('tabs'),sheet=document.getElementById('sheet'),tb=document.querySelector('#sbtable tbody');
  SCENES.forEach((S,i)=>{ const b=document.createElement('button'); b.type='button'; b.dataset.i=i; b.textContent=`${i+1} · ${S.title}`; b.onclick=()=>select(i); tabs.appendChild(b);
    const th=document.createElement('button'); th.type='button'; th.className='thumb'; th.dataset.i=i; th.innerHTML=`<canvas width="640" height="360"></canvas><span><small>${S.time}</small><b>${i+1}. ${S.title}</b></span>`; th.onclick=()=>select(i); sheet.appendChild(th);
    const tr=document.createElement('tr'); tr.innerHTML=`<td>${i+1}. ${S.title}</td><td>${S.time}</td><td>${esc(S.info)}</td><td>${esc(S.visual)}</td><td>${esc(S.beats)}</td><td>${esc(S.trans)}</td><td>${esc(S.text)}</td><td>${esc(S.sound)}</td>`; tb.appendChild(tr); }); }
function renderAll(){ document.querySelectorAll('.thumb').forEach(th=>renderTo(th.querySelector('canvas'),+th.dataset.i)); select(SEL); }
function openZoom(){ const d=document.getElementById('zoom'); document.getElementById('zoomTitle').textContent=`Scene ${SEL+1} · ${SCENES[SEL].title} · 1920×1080`; renderTo(document.getElementById('zoomCanvas'),SEL); if(d.showModal) d.showModal(); }
document.getElementById('enlarge').onclick=openZoom; document.getElementById('big').onclick=openZoom;
document.getElementById('closeZoom').onclick=()=>document.getElementById('zoom').close();
document.getElementById('zoom').addEventListener('click',e=>{ if(e.target.id==='zoom') e.currentTarget.close(); });
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>select(SEL),150); });
window.__glass={SCENES,renderTo,drawBackdrop,drawChrome};
async function boot(){ makeGrain(); build();
  const faces=['600 90px Fraunces','700 54px Fraunces','500 30px Fraunces','400 22px Archivo','500 22px Archivo','600 22px Archivo','700 18px Archivo','800 18px Archivo'];
  try{ await Promise.race([Promise.all(faces.map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,3000))]); }catch(e){}
  renderAll(); window.__ready=true;
  document.fonts&&document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{ REG.clear(); renderAll(); }); }
boot();
})();
